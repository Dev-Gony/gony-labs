name: Container Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify PostgreSQL Lab migration against PostgreSQL
        shell: bash
        run: |
          docker run --detach --name postgresql-lab-test --env POSTGRES_DB=toy_labs --env POSTGRES_USER=toy_user --env POSTGRES_PASSWORD=toy_password --publish 5433:5432 postgres:16-alpine
          for attempt in {1..45}; do
            if docker exec postgresql-lab-test pg_isready -U toy_user -d toy_labs; then break; fi
            sleep 2
          done
          cd 03-postgresql-lab
          DATABASE_URL='postgresql+psycopg://toy_user:toy_password@localhost:5433/toy_labs' python -m alembic -c alembic.ini upgrade head
          test "$(docker exec postgresql-lab-test psql -U toy_user -d toy_labs -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('questions', 'answers')")" = "2"
          DATABASE_URL='postgresql+psycopg://toy_user:toy_password@localhost:5433/toy_labs' python -m uvicorn src.main:app --host 127.0.0.1 --port 8001 &
          api_pid=$!
          trap 'kill $api_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8001/questions | grep '멱등성'
          curl --fail --silent --request POST http://127.0.0.1:8001/answers --header 'Content-Type: application/json' --data '{"question_id":1,"content":"integration answer"}' | grep 'integration answer'
      - name: Stop PostgreSQL Lab service
        if: always()
        run: docker rm --force postgresql-lab-test || true
      - name: Verify Docker Lab API and PostgreSQL
        shell: bash
        run: |
          cd 04-docker-lab
          cp .env.example .env
          docker compose up --build -d
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8000/health && curl --fail --silent http://localhost:8000/db-health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop Docker Lab services
        if: always()
        run: docker compose -f 04-docker-lab/compose.yaml down -v
      - name: Verify Redis Queue Worker end to end
        shell: bash
        run: |
          cd 05-redis-queue-lab
          docker compose up --build -d
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/health
          response=$(curl --fail --silent --request POST http://localhost:8000/jobs --header 'Content-Type: application/json' --data '{"seconds":10}')
          job_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$response")
          for attempt in {1..45}; do
            status=$(curl --fail --silent "http://localhost:8000/jobs/$job_id")
            if python -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin)["status"] == "finished" else 1)' <<< "$status"; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop Redis Queue services
        if: always()
        run: docker compose -f 05-redis-queue-lab/compose.yaml down -v
      - name: Verify pgvector initialization and RAG seeding
        shell: bash
        run: |
          cd 07-mini-rag
          docker compose up -d db
          for attempt in {1..45}; do
            if docker compose exec -T db pg_isready -U rag -d rag; then break; fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U rag -d rag
          python seed_pgvector.py
          test "$(docker compose exec -T db psql -U rag -d rag -Atc 'SELECT count(*) FROM document_chunks')" = "10"
          docker compose exec -T db psql -U rag -d rag -Atc "SELECT indexname FROM pg_indexes WHERE indexname = 'document_chunks_embedding_idx'" | grep '^document_chunks_embedding_idx$'
      - name: Stop pgvector service
        if: always()
        run: docker compose -f 07-mini-rag/compose.yaml down -v
