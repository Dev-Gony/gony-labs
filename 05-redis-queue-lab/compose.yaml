services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 default
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
